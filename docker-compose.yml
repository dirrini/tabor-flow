services:

  postgres:
    image: postgres:16
    container_name: tabor-flow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taborflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taborflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    env_file:
      - ./backend/.env.local
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: tabor-flow-api
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    env_file:
      - ./frontend/.env.local
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: tabor-flow-web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
