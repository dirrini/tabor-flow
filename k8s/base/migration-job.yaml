apiVersion: batch/v1
kind: Job
metadata:
  name: tabor-flow-migrate
  namespace: tabor-flow
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: tabor-flow-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - npx prisma migrate deploy && npx tsx prisma/seed.ts
          envFrom:
            - configMapRef:
                name: tabor-flow-config
            - secretRef:
                name: tabor-flow-secrets
