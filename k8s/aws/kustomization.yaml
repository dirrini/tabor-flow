apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ingress-class.yaml
  - ingress.yaml
images:
  - name: tabor-flow-api
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/tabor-flow-api
    newTag: ${IMAGE_TAG}
  - name: tabor-flow-web
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/tabor-flow-web
    newTag: ${IMAGE_TAG}
