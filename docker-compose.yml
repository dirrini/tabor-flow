name: tabor-flow

services:

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: tabor-flow-postgres
    env_file:
      - ./postgres/.env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    env_file:
      - ./backend/.env.local
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: tabor-flow-backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    env_file:
      - ./frontend/.env.local
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: tabor-flow-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
    name: tabor-flow_postgres_data
  backend_node_modules:
    name: tabor-flow_backend_node_modules
  frontend_node_modules:
    name: tabor-flow_frontend_node_modules
